name: Supabase Migrations

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - 'ritter-app/supabase/migrations/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push migrations via DB URL
        run: |
          supabase db push \
            --db-url "postgresql://postgres:${{ secrets.SUPABASE_DB_PASSWORD }}@db.teiyrvoisdzvttrqslgk.supabase.co:5432/postgres"
        working-directory: ritter-app
